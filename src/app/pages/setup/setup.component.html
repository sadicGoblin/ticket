<div class="setup-container">
  <div class="setup-card">
    <!-- Logo/Icon -->
    <div class="setup-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <!-- Success state -->
    <div *ngIf="success" class="success-state">
      <div class="success-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M20 6L9 17l-5-5"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <h1>Configurado</h1>
      <p class="org-name">{{ orgName }}</p>
      <p class="redirect-msg">Redirigiendo...</p>
    </div>

    <!-- Form state -->
    <div *ngIf="!success">
      <h1 *ngIf="!canCancel">Configuración Inicial</h1>
      <h1 *ngIf="canCancel">Cambiar Configuración</h1>
      <p class="setup-desc">
        Ingrese el código de la organización proporcionado por su administrador
        para configurar este terminal.
      </p>

      <!-- Code display -->
      <div class="input-group">
        <label>Código de Organización</label>
        <div class="code-display" [class.has-value]="code.length > 0">
          <span *ngIf="code.length > 0" class="code-value">{{ code }}</span>
          <span *ngIf="code.length === 0" class="code-placeholder"
            >Ej: WM001</span
          >
          <span class="cursor-blink">|</span>
        </div>
      </div>

      <div *ngIf="error" class="error-msg">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        {{ error }}
      </div>

      <!-- On-screen keyboard -->
      <div class="keyboard" *ngIf="!loading">
        <!-- Number row (always visible) -->
        <div class="kb-row">
          <button *ngFor="let k of numRow" class="kb-key" (click)="onKey(k)">
            {{ k }}
          </button>
        </div>

        <!-- Alpha rows -->
        <ng-container *ngIf="keyboardMode === 'alpha'">
          <div class="kb-row" *ngFor="let row of alphaRows; let i = index">
            <button *ngFor="let k of row" class="kb-key" (click)="onKey(k)">
              {{ k }}
            </button>
            <!-- Backspace on last row -->
            <button
              *ngIf="i === 2"
              class="kb-key kb-key-action"
              (click)="onBackspace()"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2zm-3 5l-4 4m0-4l4 4"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </ng-container>

        <!-- Action row -->
        <div class="kb-row kb-row-actions">
          <button class="kb-key kb-key-action" (click)="onClear()">
            Limpiar
          </button>
          <button
            class="kb-key kb-key-confirm"
            (click)="configurar()"
            [disabled]="!code.trim()"
          >
            Configurar
          </button>
        </div>
      </div>

      <!-- Loading state -->
      <div *ngIf="loading" class="loading-state">
        <span class="spinner"></span>
        <span>Verificando...</span>
      </div>

      <!-- Cancel button -->
      <button
        *ngIf="canCancel && !loading"
        class="btn-cancelar"
        (click)="cancelar()"
      >
        Cancelar y Volver
      </button>
    </div>
  </div>

  <p class="setup-footer" *ngIf="!canCancel">
    Este código solo se solicita una vez por terminal.
  </p>
</div>

<div class="servicio-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-inner">
      <div class="brand">
        <img
          *ngIf="logoUrl"
          class="brand-logo"
          [src]="logoUrl"
          [alt]="brandName"
        />
      </div>
      <button class="btn-back" (click)="volver()">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
            fill="currentColor"
          />
        </svg>
        Volver
      </button>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="main-content">
    <!-- Info del usuario -->
    <div class="user-badge" *ngIf="empleado">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
            fill="currentColor"
          />
        </svg>
      </div>
      <div class="user-details">
        <span class="user-name">{{ empleado.nombre }}</span>
        <span class="user-rut">{{ empleado.rut }}</span>
      </div>
    </div>

    <!-- Pregunta principal -->
    <div class="question-section">
      <h2 class="question-title">Tipo de servicio</h2>
      <p class="question-text">¿Desea empaquetar su comida para llevar?</p>
    </div>

    <!-- Opciones -->
    <div class="options-container">
      <button class="option-card" (click)="seleccionarParaLlevar()">
        <div class="option-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 14H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v10z"
              fill="currentColor"
            />
          </svg>
        </div>
        <div class="option-text">
          <span class="option-label">Para llevar</span>
          <span class="option-desc">Empaquetado para retirar</span>
        </div>
        <svg
          class="option-arrow"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M9 18l6-6-6-6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <button class="option-card" (click)="seleccionarParaServir()">
        <div class="option-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"
              fill="currentColor"
            />
          </svg>
        </div>
        <div class="option-text">
          <span class="option-label">Servirse en casino</span>
          <span class="option-desc">Comer en el comedor</span>
        </div>
        <svg
          class="option-arrow"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M9 18l6-6-6-6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
